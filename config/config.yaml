# Central configuration for the project.
# No paths or hyperparameters should be hardcoded inside src/.

paths:
  raw_data_dir: data/raw
  processed_data_dir: data/processed
  graph_dir: data/graph
  trained_models_dir: artifacts/trained_models
  results_dir: results

model:
  # Encoder: two graph convolution layers producing a drug embedding.
  # conv_type "gcn" is the default (simplest choice that meets the
  # requirement); "gat" swaps in attention without any other code change.
  conv_type: gcn
  hidden_channels: 64
  embedding_dim: 32
  dropout: 0.2
  attention_heads: 4 # only used when conv_type is "gat"

  # Decoder scoring a drug pair from its two embeddings.
  # "mlp" chosen over the simpler parameter-free "dot" on validation AUC
  # (0.9249 vs 0.9081 at 200 epochs). See docs/model_selection.md.
  decoder: mlp

training:
  # 800 epochs because the MLP decoder was still improving at the previous
  # 200-epoch cap; validation AUC plateaus around epoch 650-800.
  epochs: 800
  learning_rate: 0.01
  weight_decay: 0.0005
  patience: 50 # early stopping: epochs without validation AUC improvement
  seed: 42

recommendation:
  # Safety thresholds used by Module G (src/recommendation) to filter or
  # penalize candidate drugs. Populated on Day 8.
